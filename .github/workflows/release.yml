name: Publicar Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
      - name: Validar tag e extensão
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          ./scripts/verify.ps1
          ./scripts/build-release.ps1 -ExpectedVersion $version
          ./sidecar/build-sidecar.ps1 -Version $version
      - name: Criar Release estável
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --verify-tag --generate-notes --title "SnapTudo ${{ github.ref_name }}"
